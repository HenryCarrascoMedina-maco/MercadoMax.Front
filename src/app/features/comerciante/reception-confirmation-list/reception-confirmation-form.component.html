<ng-container *transloco="let t">
<app-form-page
  [listLink]="listPath"
  [listTitle]="t('receptionConfirmations.title')"
  [title]="t('receptionConfirmations.createTitle')">

  @if (message(); as msg) {
    <div pageAlert class="alert alert-error">{{ msg.text }}</div>
  }

  @if (form) {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="page-body">
        <p class="page-hint">{{ t('receptionConfirmations.requiredHint') }}</p>

        <div class="page-grid">
          <div class="form-group">
            <label>{{ t('receptionConfirmations.receptionId') }}<span class="req">*</span></label>
            <input type="number" formControlName="receptionId" min="1"
                   [placeholder]="t('receptionConfirmations.receptionId')" />
            @if (errorKey('receptionId'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>

          <div class="form-group">
            <label>{{ t('receptionConfirmations.confirmationDate') }}<span class="req">*</span></label>
            <input type="date" formControlName="confirmationDate" />
            @if (errorKey('confirmationDate'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>

          <div class="form-group span-2">
            <label>{{ t('receptionConfirmations.stall') }}<span class="req">*</span></label>
            <select formControlName="stallId">
              <option [ngValue]="null">{{ t('common.select') }}</option>
              @for (s of stalls(); track s.id) {
                <option [value]="s.id">{{ s.number }} — {{ s.pavilionName }}</option>
              }
            </select>
            @if (errorKey('stallId'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>

          <div class="form-group span-2">
            <label>{{ t('common.observationsOptional') }}</label>
            <textarea formControlName="observations" rows="3"></textarea>
          </div>
        </div>
      </div>

      <div class="page-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">{{ t('common.cancel') }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? t('common.processing') : t('common.save') }}
        </button>
      </div>
    </form>
  }
</app-form-page>
</ng-container>
