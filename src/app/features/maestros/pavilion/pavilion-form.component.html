<ng-container *transloco="let t">
<app-form-page
  [listLink]="listPath"
  [listTitle]="t('pavilions.title')"
  [title]="pageTitle()"
  [crumb]="isEdit() ? t('common.edit') : t('pavilions.createTitle')">

  @if (message(); as msg) {
    <div pageAlert class="alert alert-error">{{ msg.text }}</div>
  }

  @if (loading()) {
    <div class="page-loading">{{ t('common.loading') }}</div>
  } @else if (form) {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="page-body">
        <div class="page-grid">
          <div class="form-group">
            <label>{{ t('common.name') }}<span class="req">*</span></label>
            <input formControlName="name" [placeholder]="t('pavilions.namePlaceholder')" />
            @if (errorKey('name'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>
          <div class="form-group">
            <label>{{ t('pavilions.category') }}</label>
            <select formControlName="category">
              <option value="">{{ t('pavilions.selectCategory') }}</option>
              @for (c of categoryOptions(); track c) {
                <option [value]="c">{{ c }}</option>
              }
            </select>
          </div>
          <div class="form-group">
            <label>{{ t('pavilions.location') }}</label>
            <input formControlName="location" [placeholder]="t('pavilions.locationPlaceholder')" />
          </div>
        </div>
      </div>

      <div class="page-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">{{ t('common.cancel') }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? t('common.saving') : t('common.save') }}
        </button>
      </div>
    </form>
  }
</app-form-page>
</ng-container>
