<ng-container *transloco="let t">
<app-form-page
  [listLink]="listPath"
  [listTitle]="t('stalls.title')"
  [title]="pageTitle()"
  [crumb]="isEdit() ? t('common.edit') : t('stalls.createTitle')">

  @if (message(); as msg) {
    <div pageAlert class="alert alert-error">{{ msg.text }}</div>
  }

  @if (loading()) {
    <div class="page-loading">{{ t('common.loading') }}</div>
  } @else if (form) {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="page-body">
        <div class="page-grid">
          <div class="form-group">
            <label>{{ t('stalls.number') }}<span class="req">*</span></label>
            <input formControlName="number" [placeholder]="t('stalls.numberPlaceholder')" />
            @if (errorKey('number'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>
          <div class="form-group">
            <label>{{ t('stalls.pavilion') }}<span class="req">*</span></label>
            <select formControlName="pavilionId">
              <option [ngValue]="null" disabled>{{ t('common.select') }}</option>
              @for (o of pavilions(); track o.id) {
                <option [value]="o.id">{{ o.name }}</option>
              }
            </select>
            @if (errorKey('pavilionId'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>
          <div class="form-group">
            <label>{{ t('stalls.owner') }}</label>
            <select formControlName="userId">
              <option [ngValue]="null">{{ t('stalls.noOwner') }}</option>
              @for (o of ownerOptions(); track o.id) {
                <option [value]="o.id">{{ o.label }}</option>
              }
            </select>
            <span class="field-hint">{{ t('stalls.ownerHint') }}</span>
          </div>
        </div>
      </div>

      <div class="page-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">{{ t('common.cancel') }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? t('common.saving') : t('common.save') }}
        </button>
      </div>
    </form>
  }
</app-form-page>
</ng-container>
