<ng-container *transloco="let t">
<app-form-page
  [listLink]="listPath"
  [listTitle]="t('shortages.title')"
  [title]="t('shortages.createTitle')">

  @if (message(); as msg) {
    <div pageAlert class="alert alert-error">{{ msg.text }}</div>
  }

  @if (form) {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="page-body">
        <div class="page-grid">
          <div class="form-group">
            <label>{{ t('shortages.receptionDetailId') }}<span class="req">*</span></label>
            <input type="number" formControlName="receptionDetailId" />
            @if (errorKey('receptionDetailId'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>

          <div class="form-group">
            <label>{{ t('shortages.shortageQuantity') }}<span class="req">*</span></label>
            <input type="number" formControlName="shortageQuantity" />
            @if (errorKey('shortageQuantity'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>

          <div class="form-group span-2">
            <label>{{ t('shortages.reason') }}<span class="req">*</span></label>
            <textarea formControlName="reason"></textarea>
            @if (errorKey('reason'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>

          <div class="form-group span-2">
            <label>{{ t('shortages.evidence') }}</label>
            <input formControlName="evidence" />
          </div>
        </div>
      </div>

      <div class="page-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">{{ t('common.cancel') }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? t('common.saving') : t('common.save') }}
        </button>
      </div>
    </form>
  }
</app-form-page>
</ng-container>
