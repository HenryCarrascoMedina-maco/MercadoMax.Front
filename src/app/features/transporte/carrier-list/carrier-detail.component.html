<ng-container *transloco="let t">
<app-form-page
  [listLink]="listPath"
  [listTitle]="t('carriers.title')"
  [title]="(record()?.firstName + ' ' + record()?.lastName) || t('common.view')"
  [crumb]="(record()?.firstName + ' ' + record()?.lastName) || ''"
  [subtitle]="recordId() ? '#' + recordId() : ''">

  <button pageActions type="button" class="btn btn-primary"
          *hasPermission="'Transport:Update'"
          (click)="goToEdit()">
    {{ t('common.edit') }}
  </button>

  @if (message(); as msg) {
    <div pageAlert class="alert alert-error">{{ msg.text }}</div>
  }

  @if (loading()) {
    <div class="page-loading">{{ t('common.loading') }}</div>
  } @else if (record()) {
    <div class="page-body">
      <app-detail-view [items]="items()" />
    </div>
  }
</app-form-page>
</ng-container>
