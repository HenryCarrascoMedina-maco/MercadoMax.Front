<ng-container *transloco="let t">
<app-form-page
  [listLink]="listPath"
  [listTitle]="t('settlements.title')"
  [title]="t('settlements.createTitle')">

  @if (message(); as msg) {
    <div pageAlert class="alert alert-error">{{ msg.text }}</div>
  }

  @if (form) {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="page-body">
        <div class="page-grid">
          <div class="form-group">
            <label>{{ t('settlements.carrier') }}<span class="req">*</span></label>
            <select formControlName="carrierId" (change)="onCarrierChange($any($event.target).value)">
              <option [ngValue]="null">{{ t('common.select') }}</option>
              @for (c of carriers(); track c.id) {
                <option [value]="c.id">{{ c.firstName }} {{ c.lastName }}</option>
              }
            </select>
            @if (errorKey('carrierId'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>

          <div class="form-group">
            <label>{{ t('settlements.truck') }}</label>
            <select formControlName="truckId">
              <option [ngValue]="null">— {{ t('settlements.noTruck') }} —</option>
              @for (tr of trucks(); track tr.id) {
                <option [value]="tr.id">{{ tr.licensePlate }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label>{{ t('settlements.tripDate') }}<span class="req">*</span></label>
            <input type="date" formControlName="tripDate" />
            @if (errorKey('tripDate'); as ek) { <span class="field-error">{{ t(ek) }}</span> }
          </div>
        </div>

        <p class="page-hint">{{ t('settlements.detailsAfterCreateHint') }}</p>
      </div>

      <div class="page-footer">
        <button type="button" class="btn btn-secondary" (click)="cancel()">{{ t('common.cancel') }}</button>
        <button type="submit" class="btn btn-primary" [disabled]="saving()">
          {{ saving() ? t('common.saving') : t('common.save') }}
        </button>
      </div>
    </form>
  }
</app-form-page>
</ng-container>
